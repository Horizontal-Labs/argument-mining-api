version: '3.9'

services:
  argument-mining-api:
    # For local development, still build from source
    build:
      context: .
      dockerfile: Dockerfile
    # For production, this will be overridden by docker-compose.prod.yml
    image: ghcr.io/horizontal-labs/argument-mining-api:latest
    container_name: argument-mining-api
    ports:
      - "10234:10234"
    environment:
      - PORT=10234
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10234/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s